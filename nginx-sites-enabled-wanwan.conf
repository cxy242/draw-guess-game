server {
    listen 80;
    server_name _;

    root /opt/wanwan;
    index index.html;

    # 字体CORS头
    location ~* \.(woff|woff2|ttf|eot)$ {
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # 静态资源缓存7天（排除/music/和/tarot/路径）
    location ~* ^/(?!music/|tarot/)[^?]*\.(js|css|png|jpg|jpeg|gif|ico|svg|webp|mp3|wav|flac|mp4|webm)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        add_header Vary "Accept-Encoding";
    }

    # HTML不缓存
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # JSON不缓存
    location ~* \.json$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # 音乐首页
    location = /music/ {
        proxy_pass http://127.0.0.1:9090/;
        proxy_http_version 1.1;
        proxy_set_header X-Music-Gateway music-gateway;
    }
    location = /music {
        proxy_pass http://127.0.0.1:9090/;
        proxy_http_version 1.1;
        proxy_set_header X-Music-Gateway music-gateway;
    }

    # 音乐播放器API代理
    location /music/ {
        proxy_pass http://127.0.0.1:9090/music/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Music-Gateway music-gateway;
        proxy_read_timeout 300s;
    }

    # 塔罗牌引擎 (tarot-ritual on port 18643)
    location /tarot/ {
        proxy_pass http://127.0.0.1:18643/;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:18643;
        proxy_set_header Origin http://127.0.0.1:18643;
        proxy_set_header Sec-Fetch-Site same-origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # 塔罗牌companion (port 18642)
    location /companion/ {
        proxy_pass http://127.0.0.1:18642/;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:18642;
        proxy_set_header Origin http://127.0.0.1:18642;
        proxy_set_header Sec-Fetch-Site same-origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # API代理
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # Socket.io代理
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # 主路由
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri $uri/ /index.html;
    }
}
