<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ensembleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8fa0af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6b7d8d;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- 背景圆角矩形 -->
  <rect x="20" y="20" width="472" height="472" rx="80" ry="80" fill="url(#ensembleGrad)"/>
  <!-- 三个人形，代表群像 -->
  <!-- 左侧人物 -->
  <circle cx="160" cy="160" r="40" fill="#eceef1" opacity="0.9"/>
  <path d="M100 280 Q100 220 160 220 Q220 220 220 280 L220 320 L100 320 Z" fill="#eceef1" opacity="0.9"/>
  <!-- 中间人物（稍大，突出） -->
  <circle cx="256" cy="145" r="48" fill="#ffffff"/>
  <path d="M186 285 Q186 215 256 215 Q326 215 326 285 L326 340 L186 340 Z" fill="#ffffff"/>
  <!-- 右侧人物 -->
  <circle cx="352" cy="160" r="40" fill="#eceef1" opacity="0.9"/>
  <path d="M292 280 Q292 220 352 220 Q412 220 412 280 L412 320 L292 320 Z" fill="#eceef1" opacity="0.9"/>
  <!-- 底部装饰线 -->
  <line x1="120" y1="380" x2="392" y2="380" stroke="#eceef1" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <line x1="160" y1="400" x2="352" y2="400" stroke="#eceef1" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
</svg>
