  (function() {
    var cdns = [
      'https://cdn.jsdelivr.net/npm/dexie@4.4.3/dist/dexie.min.js',

      'https://cdnjs.cloudflare.com/ajax/libs/dexie/4.4.3/dexie.min.js'
    ]
    var loaded = false
    function tryLoad(i) {
      if (i >= cdns.length || loaded) return
      var s = document.createElement('script')
      s.src = cdns[i]
      s.onload = function() { loaded = true }
      s.onerror = function() { tryLoad(i + 1) }
      document.head.appendChild(s)
    }
    tryLoad(0)
  })()
  </script>

  <!-- 震撼粒子动画 -->
  <script>
  (function(){
    var c = document.getElementById('splash-canvas');
    if (!c) return;
    var ctx = c.getContext('2d');
    var W, H, t = 0;
    var particles = [], shapes = [], stars = [], shootingStars = [];

    function resize() {
      W = c.width = window.innerWidth;
      H = c.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // 颜色调色板
    var palette = [
      [168, 85, 247],  // 紫
      [236, 72, 153],  // 粉
      [139, 92, 246],  // 蓝紫
      [59, 130, 246],  // 蓝
      [244, 114, 182], // 玫瑰
      [192, 132, 252], // 淡紫
    ];

    // 初始化星尘
    for (var i = 0; i < 100; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.2 + 0.2,
        twinkle: Math.random() * Math.PI * 2,
        speed: Math.random() * 0.02 + 0.005,
        color: palette[Math.floor(Math.random() * palette.length)]
      });
    }

    // 初始化浮动粒子
    for (var i = 0; i < 30; i++) {
      var col = palette[Math.floor(Math.random() * palette.length)];
      particles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.5,
        vy: (Math.random() - 0.5) * 0.5,
        r: Math.random() * 3 + 1.5,
        color: col,
        phase: Math.random() * Math.PI * 2,
        orbit: Math.random() * 20 + 10
      });
    }

    // 初始化几何形状
    for (var i = 0; i < 8; i++) {
      var col = palette[Math.floor(Math.random() * palette.length)];
      shapes.push({
        x: Math.random() * W,
        y: Math.random() * H,
        size: Math.random() * 20 + 8,
        rotation: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.01,
        vx: (Math.random() - 0.5) * 0.3,
        vy: (Math.random() - 0.5) * 0.3,
        sides: [3, 4, 5, 6][Math.floor(Math.random() * 4)],
        color: col,
        alpha: Math.random() * 0.15 + 0.05
      });
    }

    // 流星
    function spawnShootingStar() {
      if (shootingStars.length < 3 && Math.random() < 0.008) {
        shootingStars.push({
          x: Math.random() * W,
          y: 0,
          vx: (Math.random() - 0.5) * 3,
          vy: Math.random() * 4 + 3,
          life: 1,
          trail: []
        });
      }
    }

    // 绘制极光波浪
    function drawAurora() {
      for (var layer = 0; layer < 3; layer++) {
        var yBase = H * (0.2 + layer * 0.25);
        var amp = 40 + layer * 15;
        var freq = 0.003 - layer * 0.0005;
        var speed = t * (0.3 + layer * 0.1);
        var col = palette[layer];

        ctx.beginPath();
        ctx.moveTo(0, H);
        for (var x = 0; x <= W; x += 3) {
          var y = yBase + Math.sin(x * freq + speed) * amp + Math.sin(x * freq * 2.3 + speed * 0.7) * amp * 0.4;
          ctx.lineTo(x, y);
        }
        ctx.lineTo(W, H);
        ctx.closePath();

        var grad = ctx.createLinearGradient(0, yBase - amp, 0, H);
        grad.addColorStop(0, 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',0.04)');
        grad.addColorStop(0.5, 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',0.02)');
        grad.addColorStop(1, 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',0)');
        ctx.fillStyle = grad;
        ctx.fill();
      }
    }

    // 绘制星尘
    function drawStars() {
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        s.twinkle += s.speed;
        var alpha = (Math.sin(s.twinkle) + 1) * 0.4 + 0.1;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(' + s.color[0] + ',' + s.color[1] + ',' + s.color[2] + ',' + alpha + ')';
        ctx.fill();
        // 十字闪光
        if (s.r > 1) {
          ctx.beginPath();
          ctx.moveTo(s.x - s.r * 2, s.y);
          ctx.lineTo(s.x + s.r * 2, s.y);
          ctx.moveTo(s.x, s.y - s.r * 2);
          ctx.lineTo(s.x, s.y + s.r * 2);
          ctx.strokeStyle = 'rgba(' + s.color[0] + ',' + s.color[1] + ',' + s.color[2] + ',' + (alpha * 0.3) + ')';
          ctx.lineWidth = 0.3;
          ctx.stroke();
        }
      }
    }

    // 绘制浮动粒子
    function drawParticles() {
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        p.phase += 0.015;
        p.x += p.vx + Math.sin(p.phase) * 0.3;
        p.y += p.vy + Math.cos(p.phase * 0.7) * 0.2;

        // 边界回弹
        if (p.x < -50) p.x = W + 50;
        if (p.x > W + 50) p.x = -50;
        if (p.y < -50) p.y = H + 50;
        if (p.y > H + 50) p.y = -50;

        // 粒子本体
        var grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 3);
        grad.addColorStop(0, 'rgba(' + p.color[0] + ',' + p.color[1] + ',' + p.color[2] + ',0.4)');
        grad.addColorStop(0.5, 'rgba(' + p.color[0] + ',' + p.color[1] + ',' + p.color[2] + ',0.1)');
        grad.addColorStop(1, 'rgba(' + p.color[0] + ',' + p.color[1] + ',' + p.color[2] + ',0)');
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * 3, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();
      }

      // 连线
      for (var i = 0; i < particles.length; i++) {
        for (var j = i + 1; j < particles.length; j++) {
          var dx = particles[i].x - particles[j].x;
          var dy = particles[i].y - particles[j].y;
          var d = Math.sqrt(dx * dx + dy * dy);
          if (d < 150) {
            var a = (1 - d / 150) * 0.08;
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.strokeStyle = 'rgba(168, 85, 247, ' + a + ')';
            ctx.lineWidth = 0.5;
            ctx.stroke();
          }
        }
      }
    }

    // 绘制几何形状
    function drawShapes() {
      for (var i = 0; i < shapes.length; i++) {
        var s = shapes[i];
        s.rotation += s.rotSpeed;
        s.x += s.vx;
        s.y += s.vy;
        if (s.x < -50) s.x = W + 50;
        if (s.x > W + 50) s.x = -50;
        if (s.y < -50) s.y = H + 50;
        if (s.y > H + 50) s.y = -50;

        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate(s.rotation);
        ctx.beginPath();
        for (var k = 0; k < s.sides; k++) {
          var angle = (Math.PI * 2 / s.sides) * k - Math.PI / 2;
          var px = Math.cos(angle) * s.size;
          var py = Math.sin(angle) * s.size;
          k === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.strokeStyle = 'rgba(' + s.color[0] + ',' + s.color[1] + ',' + s.color[2] + ',' + s.alpha + ')';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.restore();
      }
    }

    // 流星
    function drawShootingStars() {
      spawnShootingStar();
      for (var i = shootingStars.length - 1; i >= 0; i--) {
        var s = shootingStars[i];
        s.trail.push({x: s.x, y: s.y, life: 1});
        s.x += s.vx;
        s.y += s.vy;
        s.life -= 0.015;

        // 绘制尾迹
        for (var j = 0; j < s.trail.length; j++) {
          s.trail[j].life -= 0.04;
          if (s.trail[j].life <= 0) {
            s.trail.splice(j, 1);
            j--;
            continue;
          }
          ctx.beginPath();
          ctx.arc(s.trail[j].x, s.trail[j].y, 1.5 * s.trail[j].life, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(192, 132, 252, ' + (s.trail[j].life * 0.6) + ')';
          ctx.fill();
        }

        // 流星头
        ctx.beginPath();
        ctx.arc(s.x, s.y, 2, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, ' + s.life + ')';
        ctx.fill();

        if (s.life <= 0 || s.y > H + 20) {
          shootingStars.splice(i, 1);
        }
      }
    }

    function draw() {
      t += 0.016;
      ctx.clearRect(0, 0, W, H);
      drawAurora();
      drawStars();
      drawShapes();
      drawParticles();
      drawShootingStars();
      requestAnimationFrame(draw);
    }
    draw();
  })();
  </script>

  </body>
  <!-- 粒子动画 -->
  <script>
  (function(){
    var c = document.getElementById('splash-canvas');
    if (!c) return;
    var ctx = c.getContext('2d');
    var W, H, t = 0;
    var particles = [];

    function resize() { W = c.width = window.innerWidth; H = c.height = window.innerHeight; }
    resize();
    window.addEventListener('resize', resize);

    // 柔和粒子
    for (var i = 0; i < 40; i++) {
      particles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 2 + 0.5,
        vx: (Math.random() - 0.5) * 0.2,
        vy: (Math.random() - 0.5) * 0.2,
        phase: Math.random() * Math.PI * 2,
        blue: Math.random() > 0.5
      });
    }

    function draw() {
      t += 0.01;
      ctx.clearRect(0, 0, W, H);

      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        p.phase += 0.01;
        p.x += p.vx + Math.sin(p.phase) * 0.15;
        p.y += p.vy + Math.cos(p.phase * 0.8) * 0.1;

        if (p.x < -20) p.x = W + 20;
        if (p.x > W + 20) p.x = -20;
        if (p.y < -20) p.y = H + 20;
        if (p.y > H + 20) p.y = -20;

        var alpha = (Math.sin(p.phase * 2) + 1) * 0.15 + 0.05;
        var col = p.blue ? '96, 165, 250' : '244, 114, 182';

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * 4, 0, Math.PI * 2);
        var grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 4);
        grad.addColorStop(0, 'rgba(' + col + ',' + alpha + ')');
        grad.addColorStop(1, 'rgba(' + col + ',0)');
        ctx.fillStyle = grad;
        ctx.fill();
      }

      // 连线
      for (var i = 0; i < particles.length; i++) {
        for (var j = i + 1; j < particles.length; j++) {
          var dx = particles[i].x - particles[j].x;
          var dy = particles[i].y - particles[j].y;
          var d = Math.sqrt(dx * dx + dy * dy);
          if (d < 120) {
            var a = (1 - d / 120) * 0.04;
            var mix = particles[i].blue ? '96, 165, 250' : '244, 114, 182';
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.strokeStyle = 'rgba(' + mix + ',' + a + ')';
            ctx.lineWidth = 0.5;
            ctx.stroke();
          }
        }
      }

      requestAnimationFrame(draw);
    }
    draw();
  })();
  </script>
